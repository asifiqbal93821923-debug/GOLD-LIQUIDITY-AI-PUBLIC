name: Free XAU sampled data collector

on:
  push:
    branches: [main]
    paths:
      - "scripts/collect_free_xau.py"
      - ".github/workflows/free-xau-data.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-xau-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and save public XAUS samples
        run: python scripts/collect_free_xau.py
      - name: Commit updated public snapshot and archive
        run: |
          git add -f web/public/data/market-snapshot.json web/public/data/market-history.json
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh free XAUS sampled history"
          git push
