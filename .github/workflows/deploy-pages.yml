name: Deploy Android PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/free-xau-data.yml"
  workflow_run:
    workflows: ["Free XAU sampled data collector"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main (includes collector-generated data)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Build static PWA
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ vars.GOLD_TERMINAL_API_BASE_URL || 'https://gold-terminal-api.onrender.com' }}
        run: npm run build
      - name: Configure Pages artifact
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed app and data assets return HTTP 200
        shell: bash
        run: |
          set -euo pipefail
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${PAGE_URL}" -o /tmp/index.html
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${PAGE_URL}data/market-snapshot.json" -o /tmp/market-snapshot.json
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${PAGE_URL}data/market-history.json" -o /tmp/market-history.json
          python - <<'PY'
          import json
          with open("/tmp/index.html", encoding="utf-8") as f:
              html = f.read()
          with open("/tmp/market-snapshot.json", encoding="utf-8") as f:
              snapshot = json.load(f)
          with open("/tmp/market-history.json", encoding="utf-8") as f:
              history = json.load(f)
          assert "<html" in html.lower(), "Pages root did not return HTML"
          assert isinstance(snapshot.get("points"), list) and snapshot["points"], "Snapshot has no points"
          assert isinstance(history.get("points"), list) and history["points"], "History archive has no points"
          assert history.get("retention_days") == 90, history.get("retention_days")
          print("Pages root: PASS (HTTP 200)")
          print("Snapshot JSON: PASS (HTTP 200); points:", len(snapshot["points"]))
          print("History JSON: PASS (HTTP 200); points:", len(history["points"]))
          print("Archive retention metadata: PASS (90 days)")
          PY
