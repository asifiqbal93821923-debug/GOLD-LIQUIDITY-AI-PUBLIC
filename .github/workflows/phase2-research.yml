name: Phase 2 same-feed research

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Exact TradingView provider/feed label (must match every CSV)"
        required: true
        type: string
      symbol:
        description: "Exact TradingView ticker, e.g. OANDA:XAUUSD"
        required: true
        type: string
      spread_points:
        description: "Observed target-broker spread in points"
        required: true
        type: string
      slippage_points:
        description: "Conservative slippage in points"
        required: true
        type: string
      commission_points_per_side:
        description: "Commission converted to price points per side"
        required: true
        default: "0"
        type: string
      point_size:
        description: "Price units per broker point (verify contract specification)"
        required: true
        default: "0.01"
        type: string
      max_spread_points:
        description: "Observed defensible maximum spread; 0 keeps P2.5 replay signals blocked"
        required: true
        default: "0"
        type: string
      xm360_symbol:
        description: "Exact XM360 XAUUSD contract symbol"
        required: true
        default: "XAUUSD"
        type: string
      rollover_start_utc:
        description: "Broker-documented rollover window start in UTC (HH:MM); required only with quote CSV"
        required: false
        default: ""
        type: string
      rollover_end_utc:
        description: "Broker-documented rollover window end in UTC (HH:MM); required only with quote CSV"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Check same-feed CSV inputs
        run: |
          test -s data/phase2/xauusd_4h.csv
          test -s data/phase2/xauusd_1h.csv
          test -s data/phase2/xauusd_15m.csv
      - name: Validate and combine the same-feed exports
        run: |
          EXTRA=""
          if [ -s data/phase2/xauusd_5m.csv ]; then EXTRA="--5m data/phase2/xauusd_5m.csv"; fi
          python scripts/prepare_xauusd_dataset.py \
            --source "${{ inputs.source }}" \
            --symbol "${{ inputs.symbol }}" \
            --4h data/phase2/xauusd_4h.csv \
            --1h data/phase2/xauusd_1h.csv \
            --15m data/phase2/xauusd_15m.csv \
            $EXTRA \
            --output reports/phase2/xauusd_mtf_ohlcv.json
      - name: Parameter optimizer and sealed test
        run: |
          python -m scripts.optimize_alpha_settings \
            --input reports/phase2/xauusd_mtf_ohlcv.json \
            --candidates 100 \
            --spread-points "${{ inputs.spread_points }}" \
            --slippage-points "${{ inputs.slippage_points }}" \
            --commission-points-per-side "${{ inputs.commission_points_per_side }}" \
            --point-size "${{ inputs.point_size }}" \
            --output reports/phase2/alpha-optimizer.json
      - name: 1H entry, stop-loss and target calibration
        run: |
          python -m scripts.calibrate_trade_plan \
            --input reports/phase2/xauusd_mtf_ohlcv.json \
            --spread-points "${{ inputs.spread_points }}" \
            --slippage-points "${{ inputs.slippage_points }}" \
            --commission-points-per-side "${{ inputs.commission_points_per_side }}" \
            --point-size "${{ inputs.point_size }}" \
            --output reports/phase2/trade-plan-calibration.json
      - name: Multi-fold rolling walk-forward and out-of-sample test
        run: |
          python -m scripts.rolling_walk_forward_validation \
            --input reports/phase2/xauusd_mtf_ohlcv.json \
            --folds 4 \
            --mode rolling \
            --train-fraction 0.12 \
            --test-fraction 0.10 \
            --holdout-fraction 0.10 \
            --spread-points "${{ inputs.spread_points }}" \
            --slippage-points "${{ inputs.slippage_points }}" \
            --commission-points-per-side "${{ inputs.commission_points_per_side }}" \
            --point-size "${{ inputs.point_size }}" \
            --output reports/phase2/walk-forward.json
      - name: P2.5 base, conservative and adverse execution-cost scenarios
        run: |
          python -m scripts.execution_cost_scenarios \
            --input reports/phase2/xauusd_mtf_ohlcv.json \
            --spread-points "${{ inputs.spread_points }}" \
            --slippage-points "${{ inputs.slippage_points }}" \
            --commission-points-per-side "${{ inputs.commission_points_per_side }}" \
            --point-size "${{ inputs.point_size }}" \
            --max-spread-points "${{ inputs.max_spread_points }}" \
            --output reports/phase2/execution-cost-scenarios.json
      - name: P2.5 audit observed XM360 bid-ask quotes by UTC session and rollover
        run: |
          if [ -s data/phase2/xm360_quotes.csv ]; then
            test -n "${{ inputs.rollover_start_utc }}" || (echo "rollover_start_utc required when xm360_quotes.csv is supplied" && exit 1)
            test -n "${{ inputs.rollover_end_utc }}" || (echo "rollover_end_utc required when xm360_quotes.csv is supplied" && exit 1)
            python -m scripts.analyze_broker_quotes \
              --input data/phase2/xm360_quotes.csv \
              --broker XM360 \
              --symbol "${{ inputs.xm360_symbol }}" \
              --rollover-start-utc "${{ inputs.rollover_start_utc }}" \
              --rollover-end-utc "${{ inputs.rollover_end_utc }}" \
              --output reports/phase2/xm360-quote-session-audit.json
          else
            echo "No XM360 quote observations supplied; broker session/rollover empirical validation remains pending."
          fi
      - name: False-breakout, sweep and retest diagnostics
        run: |
          python -m scripts.analyze_price_action_setups \
            --input reports/phase2/xauusd_mtf_ohlcv.json \
            --output reports/phase2/price-action-setups.json
      - name: Generate Python reference and compare Pine export when supplied
        run: |
          SETTINGS=""
          if [ -s data/phase2/alpha-settings.json ]; then SETTINGS="--settings data/phase2/alpha-settings.json"; fi
          python -m scripts.export_python_signal_events \
            --input reports/phase2/xauusd_mtf_ohlcv.json \
            --timeframe 1h $SETTINGS \
            --output reports/phase2/python-signals-1h.csv
          if [ -s data/phase2/pine_reference_1h.csv ]; then
            test -s data/phase2/pine-reference-meta.json || (echo "Pine reference CSV supplied without exact metadata manifest; refusing parity PASS." && exit 1)
            test -s data/phase2/alpha-settings.json || (echo "Pine parity requires explicit alpha-settings.json; do not infer default settings." && exit 1)
            python -m scripts.build_pine_candidate_metadata \
              --reference-meta data/phase2/pine-reference-meta.json \
              --python-settings data/phase2/alpha-settings.json \
              --source "${{ inputs.source }}" \
              --symbol "${{ inputs.symbol }}" \
              --output reports/phase2/python-candidate-meta.json
            python scripts/compare_tradingview_signals.py \
              --reference data/phase2/pine_reference_1h.csv \
              --candidate reports/phase2/python-signals-1h.csv \
              --signal-column phase2_signal \
              --reference-meta data/phase2/pine-reference-meta.json \
              --candidate-meta reports/phase2/python-candidate-meta.json \
              --output reports/phase2/tradingview-parity.json
          else
            echo "No TradingView golden event CSV supplied; empirical P2.2 parity remains pending."
          fi
      - name: Upload all reports and provenance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-research-${{ github.run_number }}
          path: |
            reports/phase2/
            data/phase2/pine_reference_1h.csv
            data/phase2/pine-reference-meta.json
            data/phase2/alpha-settings.json
            reports/phase2/xm360-quote-session-audit.json
          if-no-files-found: warn
          retention-days: 30
