name: Backend engine tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q server
      - name: Run engine unit tests
        run: python -m unittest discover -s server/tests -v
