name: Download independent Dukascopy XAUUSD research history

on:
  push:
    paths:
      - ".github/workflows/download-xauusd-history.yml"
      - "scripts/download_xauusd_same_feed.py"
  workflow_dispatch:
    inputs:
      from_date:
        description: "UTC start date (YYYY-MM-DD)"
        required: true
        default: "2020-01-01"
        type: string
      to_date:
        description: "UTC end date (YYYY-MM-DD, inclusive)"
        required: true
        default: "2026-11-03"
        type: string

permissions:
  contents: read

jobs:
  download-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download independent Dukascopy XAUUSD M1 BID and derive timeframes
        env:
          FROM_DATE: ${{ inputs.from_date || '2020-01-01' }}
          TO_DATE: ${{ inputs.to_date || '' }}
        run: |
          TO_DATE="${TO_DATE:-$(date -u +%F)}"
          python scripts/download_xauusd_same_feed.py \
            --from-date "$FROM_DATE" \
            --to-date "$TO_DATE" \
            --output-dir data/dukascopy_research \
            --raw-dir data/raw/dukascopy_research
      - name: Audit independent research CSVs
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("data/dukascopy_research")
          manifest = json.loads((root / "xauusd_data_manifest.json").read_text())
          expected = {"4h": "xauusd_4h.csv", "1h": "xauusd_1h.csv", "15m": "xauusd_15m.csv"}
          for tf, name in expected.items():
              path = root / name
              with path.open(newline="") as f:
                  rows = list(csv.DictReader(f))
              assert len(rows) >= 250, (tf, len(rows))
              times = [int(r["timestamp"]) for r in rows]
              assert times == sorted(set(times)), tf
              assert all(float(r["high"]) >= max(float(r["open"]), float(r["close"]), float(r["low"])) for r in rows), tf
              assert all(float(r["low"]) <= min(float(r["open"]), float(r["close"]), float(r["high"])) for r in rows), tf
              print(f"{name}: PASS | {len(rows)} bars | {manifest['aggregation'][tf]['first_open_utc']} -> {manifest['aggregation'][tf]['last_open_utc']}")
          assert manifest["provider"] == "Dukascopy"
          assert manifest["price_side"] == "BID"
          assert manifest["timezone"] == "UTC"
          assert manifest["feed_role"] == "independent_research_only"
          assert manifest["tradingview_same_feed_verified"] is False
          assert manifest["broker_execution_prices_verified"] is False
          print("DUKASCOPY RESEARCH DATA QUALITY: PASS")
          print("TRADINGVIEW SAME-FEED ACCEPTANCE: NOT CLAIMED")
          PY
      - name: Upload separate Dukascopy research dataset
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-xauusd-independent-research
          path: |
            data/dukascopy_research/xauusd_4h.csv
            data/dukascopy_research/xauusd_1h.csv
            data/dukascopy_research/xauusd_15m.csv
            data/dukascopy_research/xauusd_data_manifest.json
          if-no-files-found: error
          retention-days: 90
