name: Docker image build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t gold-terminal-api:test .
      - name: Build web image
        run: docker build -f web/Dockerfile -t gold-terminal-web:test .
